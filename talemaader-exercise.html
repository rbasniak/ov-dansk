<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Idioms Exercise | Danish Practice</title>
  <link rel="stylesheet" href="css/style.css?v=feedback-redesign-1" />
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
</head>
<body>
  <div id="exercise-view">
    <div class="progress-header">
      <button class="back-btn" onclick="history.back()" aria-label="Back">←</button>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="progress-text" id="progress-text">1 / 10</span>
    </div>
    <div class="question-card custom-question-card" id="idiom-question-card">
      <div class="custom-card-inner" id="idiom-card-inner">
        <div class="custom-card-face custom-card-front" id="idiom-card-front">
          <div class="question-prompt" id="question-prompt"></div>
          <div class="question-text" id="question-text"></div>
          <button id="idiom-question-tts-btn" class="custom-question-tts" type="button" onclick="event.stopPropagation();idiomPlayTTS()" aria-label="Hear pronunciation">🔊</button>
          <div class="custom-card-hint">Tap the card to see the meaning</div>
        </div>
        <div class="custom-card-face custom-card-back" id="idiom-card-back">
          <div class="question-prompt">Meaning</div>
          <div class="custom-card-meaning" id="question-meaning"></div>
          <div class="custom-card-hint">Tap the card to show the Danish expression</div>
        </div>
      </div>
    </div>
    <div class="answer-grid" id="answer-grid"></div>
  </div>

  <div class="feedback-overlay hidden" id="feedback-overlay" role="dialog" aria-modal="true"
       aria-labelledby="feedback-title" tabindex="-1" onclick="idiomNextQuestion()"
       onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();idiomNextQuestion();}">
    <div class="feedback-status">
      <div class="feedback-icon" id="feedback-icon"></div>
      <div class="feedback-status-copy">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="feedback-subtitle" id="feedback-subtitle"></div>
      </div>
    </div>
    <div class="feedback-answer-card">
      <div class="feedback-answer-label">Danish expression</div>
      <div class="feedback-answer-term" id="feedback-answer-term"></div>
      <div class="feedback-audio-row">
        <button id="tts-btn" class="tts-btn" onclick="event.stopPropagation();idiomPlayTTS()" aria-label="Hear pronunciation">🔊</button>
      </div>
      <div class="feedback-answer-label">Meaning</div>
      <div class="feedback-correct" id="feedback-answer-meaning"></div>
    </div>
    <div class="feedback-details">
      <div id="idiom-info-container" class="idiom-info-container"></div>
    </div>
    <div class="feedback-tap">Tap anywhere else to continue</div>
  </div>

  <div id="summary-view" style="display:none">
    <div class="header" style="padding-top:20px">
      <a href="talemaader-config.html" class="back-btn" aria-label="Back">←</a>
      <div class="page-title">Results</div>
    </div>
    <div id="empty-state-view" style="display:none;flex-direction:column">
      <div class="header" style="padding-top:20px">
        <a href="talemaader-config.html" class="back-btn" aria-label="Back">←</a>
        <div class="page-title">All caught up!</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 0 40px">
        <div style="font-size:72px">🎯</div>
        <div class="summary-msg" id="empty-msg"></div>
        <div class="summary-actions"><a href="talemaader-config.html" class="btn-secondary">Change Settings</a><a href="index.html" class="btn-secondary">Home</a></div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 0 40px">
      <div class="score-circle"><span class="score-number" id="score-number">0</span><span class="score-total" id="score-total">/ 10</span></div>
      <div class="score-pct" id="score-pct">0%</div><div class="summary-msg" id="summary-msg"></div>
      <div class="summary-actions"><button class="start-btn" onclick="location.reload()">Play Again →</button><a href="talemaader-config.html" class="btn-secondary">Change Settings</a><a href="index.html" class="btn-secondary">Home</a></div>
    </div>
  </div>
  <script src="js/audio-assets.js"></script>
  <script src="js/idioms-exercise.js?v=feedback-redesign-1"></script>
</body>
</html>
