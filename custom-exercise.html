<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="referrer" content="no-referrer" />
  <title>Saved Words Exercise | Danish Practice</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
</head>
<body>
  <div id="exercise-view">
    <div class="progress-header">
      <button class="back-btn" onclick="history.back()" aria-label="Back">←</button>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="progress-text" id="progress-text">1 / 10</span>
    </div>
    <div class="question-card custom-question-card" id="custom-question-card">
      <div id="custom-card-front">
        <div class="question-prompt" id="question-prompt"></div>
        <div class="question-text" id="question-text"></div>
        <button id="question-tts-btn" class="custom-question-tts" type="button" onclick="event.stopPropagation();customPlayTTS()" aria-label="Hear pronunciation">🔊</button>
        <div class="custom-card-hint">Tap the card to see the definition</div>
      </div>
      <div id="custom-card-back" hidden>
        <div class="question-prompt">Meaning</div>
        <div class="custom-card-meaning" id="question-meaning"></div>
        <div class="custom-card-hint">Tap the card to show the Danish term</div>
      </div>
    </div>
    <div class="answer-grid" id="answer-grid"></div>
  </div>

  <div class="feedback-overlay hidden" id="feedback-overlay" onclick="customNextQuestion()">
    <div class="feedback-icon" id="feedback-icon"></div>
    <div class="feedback-title" id="feedback-title"></div>
    <div class="feedback-subtitle" id="feedback-subtitle"></div>
    <div id="custom-info-container" class="idiom-info-container"></div>
    <button id="tts-btn" class="tts-btn" onclick="event.stopPropagation();customPlayTTS()" aria-label="Hear pronunciation">🔊</button>
    <span id="tts-label" class="tts-verb-label"></span>
    <div class="feedback-tap">Tap anywhere else to continue</div>
  </div>

  <div id="summary-view" style="display:none">
    <div class="header" style="padding-top:20px">
      <a href="custom-config.html" class="back-btn" aria-label="Back">←</a>
      <div class="page-title">Results</div>
    </div>
    <div id="empty-state-view" style="display:none;flex-direction:column">
      <div class="header" style="padding-top:20px">
        <a href="custom-config.html" class="back-btn" aria-label="Back">←</a>
        <div class="page-title">All caught up!</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 0 40px">
        <div style="font-size:72px">🎯</div>
        <div class="summary-msg" id="empty-msg"></div>
        <div class="summary-actions"><a href="custom-config.html" class="btn-secondary">Change Settings</a><a href="index.html" class="btn-secondary">Home</a></div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 0 40px">
      <div class="score-circle"><span class="score-number" id="score-number">0</span><span class="score-total" id="score-total">/ 10</span></div>
      <div class="score-pct" id="score-pct">0%</div><div class="summary-msg" id="summary-msg"></div>
      <div class="summary-actions"><button class="start-btn" onclick="location.reload()">Play Again →</button><a href="custom-config.html" class="btn-secondary">Change Settings</a><a href="index.html" class="btn-secondary">Home</a></div>
    </div>
  </div>
  <script src="js/custom-exercise.js?v=self-assessment-card-2"></script>
</body>
</html>
